name: MC SekaiLink Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go Tests
        run: go test -v ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Desktop App & Headless Daemon
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;$env:PATH"
          wails build -s -skipbindings -o MC-SekaiLink-windows-amd64.exe
          go build -ldflags="-s -w" -o build/bin/sekailink-daemon-windows-amd64.exe ./cmd/sekailink-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mc-sekailink-windows
          path: |
            build/bin/MC-SekaiLink-windows-amd64.exe
            build/bin/sekailink-daemon-windows-amd64.exe

  build-linux:
    needs: build-frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Desktop & Headless Daemons
        run: |
          export PATH="$HOME/go/bin:$PATH"
          wails build -s -skipbindings -tags webkit2_41 -o MC-SekaiLink-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/bin/sekailink-daemon-linux-amd64 ./cmd/sekailink-daemon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/bin/sekailink-daemon-linux-arm64 ./cmd/sekailink-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mc-sekailink-linux
          path: |
            build/bin/MC-SekaiLink-linux-amd64
            build/bin/sekailink-daemon-linux-amd64
            build/bin/sekailink-daemon-linux-arm64

  build-android:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go Core & Bundle playit.gg for Android ARM64
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libsekailink_core.so ./cmd/sekailink-daemon
          PLAYIT_URL=$(curl -fsSL https://api.github.com/repos/playit-cloud/playit-agent/releases/latest | jq -r '.assets[] | select(.name == "playit-linux-aarch64") | .browser_download_url' | head -n1 || true)
          if [ -n "$PLAYIT_URL" ] && [ "$PLAYIT_URL" != "null" ]; then
            curl -fSL -o android/app/src/main/jniLibs/arm64-v8a/libplayit_agent.so "$PLAYIT_URL" || true
            chmod +x android/app/src/main/jniLibs/arm64-v8a/libplayit_agent.so || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MC-SekaiLink-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mc-sekailink-android
          path: MC-SekaiLink-android-arm64.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
